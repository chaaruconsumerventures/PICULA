
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="description"
        content="Explore PICULA Laddu Gopal shringar product details.">

  <title>Product Details | PICULA</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* PICULA PREMIUM PRODUCT DETAILS */

    body {
      background: #fffaf6;
    }

    .picula-detail-header {
      background: #fffaf6;
      border-bottom: 1px solid #eaded3;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .picula-brand {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #34251f;
      text-decoration: none;
    }

    .picula-brand span {
      color: #bc8c75;
    }

    .picula-header-link {
      color: #795746;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .picula-header-link:hover {
      text-decoration: underline;
    }

    .picula-detail-main {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    .picula-demo-banner {
      background: #f5e8dc;
      color: #75513f;
      border: 1px solid #ead6c5;
      border-radius: 10px;
      padding: 15px 20px;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    /* Product content generated by script.js */

    #picula-product-detail {
      background: white;
      border: 1px solid #eee1d6;
      border-radius: 20px;
      padding: 30px;
    }

    .picula-back {
      display: inline-block;
      color: #815a46;
      text-decoration: none;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .picula-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr)
                             minmax(0, 1fr);
      gap: 45px;
      align-items: start;
    }

    .picula-detail-image {
      background: #f7ede5;
      border-radius: 16px;
      overflow: hidden;
      min-height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .picula-detail-image img {
      width: 100%;
      height: 460px;
      object-fit: contain;
      display: block;
    }

    .picula-detail-info {
      padding: 15px 0;
    }

    .picula-eyebrow {
      color: #a1745c;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .picula-detail-info h1 {
      font-size: clamp(28px, 4vw, 44px);
      color: #34251f;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .picula-detail-info h2 {
      color: #865640;
      font-size: 30px;
      margin-bottom: 20px;
    }

    .picula-detail-info p {
      color: #706057;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .picula-detail-info label {
      display: block;
      color: #49372e;
      font-weight: 600;
      margin: 18px 0 8px;
    }

    .picula-detail-info select,
    .picula-detail-info input {
      width: 100%;
      max-width: 420px;
      display: block;
      border: 1px solid #dcc8ba;
      border-radius: 9px;
      padding: 13px 15px;
      font-size: 15px;
      background: white;
      color: #34251f;
      box-sizing: border-box;
    }

    .picula-primary {
      display: block;
      width: 100%;
      max-width: 420px;
      background: #34251f;
      color: white;
      border: none;
      border-radius: 9px;
      padding: 16px 20px;
      margin-top: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .picula-primary:hover {
      background: #855b45;
    }

    .picula-muted {
      font-size: 13px;
      color: #8a776b;
      margin-top: 15px;
    }

    /* Cart */

    #picula-cart {
      margin-top: 35px;
      padding: 25px;
      background: #fff;
      border: 1px solid #eaded3;
      border-radius: 15px;
    }

    #picula-cart h3 {
      color: #34251f;
      margin-bottom: 15px;
    }

    .cart-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee1d6;
    }

    .cart-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .cart-controls button,
    #picula-cart > button {
      background: #f1e2d7;
      color: #51392c;
      border: 1px solid #dfc8b8;
      border-radius: 7px;
      padding: 9px 14px;
      cursor: pointer;
    }

    #picula-checkout {
      background: white;
      border: 1px solid #eaded3;
      border-radius: 15px;
      padding: 25px;
      margin-top: 25px;
    }

    .checkout-form {
      display: grid;
      gap: 15px;
      margin-top: 20px;
    }

    .checkout-form label {
      display: grid;
      gap: 7px;
      font-weight: 600;
    }

    .checkout-form input {
      padding: 12px;
      border: 1px solid #dcc8ba;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }

    .checkout-form button {
      background: #34251f;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
    }

    .picula-detail-footer {
      background: #34251f;
      color: #e8d7cb;
      text-align: center;
      padding: 30px 20px;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .picula-detail-grid {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      #picula-product-detail {
        padding: 18px;
      }

      .picula-detail-image {
        min-height: 280px;
      }

      .picula-detail-image img {
        height: 320px;
      }

      .picula-detail-main {
        padding: 20px 12px 45px;
      }
    }
  </style>

  <script src="script.js" defer></script>
</head>

<body>

  <header class="picula-detail-header">

    <a href="index.html" class="picula-brand">
      PICULA<span>.</span>
    </a>

    <a href="laddu-gopal.html"
       class="picula-header-link">
      ← Back to Laddu Gopal Collection
    </a>

  </header>

  <main class="picula-detail-main">

    <div class="picula-demo-banner">
      ✦ PICULA COLLECTION PREVIEW ✦
      Product images and prices are samples.
      Actual stock is not confirmed.
      Orders and online payments are not active.
    </div>

    <section id="picula-product-detail"></section>

  </main>

  <footer class="picula-detail-footer">
    © <span id="year"></span> PICULA
    · A Chaaru Consumer Ventures Brand
    · Demo Store
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
